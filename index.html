<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>智能安防云监控</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0f1e; color: #eee; padding: 20px; }
        .card { background: rgba(18,25,45,0.8); border-radius: 20px; padding: 20px; margin: 10px; display: inline-block; width: 300px; }
        .temp { color: #ff6b6b; font-size: 48px; }
        .humi { color: #4d9eff; font-size: 48px; }
        .finger { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>工厂安防云监控</h1>
    <div id="tempDisplay">-- °C</div>
    <div id="humiDisplay">-- %</div>
    <div id="fingerStatus">等待指纹...</div>
    <div id="fingerRaw"></div>
    <script>
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('factory/data/temphumi');
            client.subscribe('factory/data/finger');
        });
        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            if (topic === 'factory/data/temphumi') {
                document.getElementById('tempDisplay').innerHTML = data.temp.toFixed(1) + ' °C';
                document.getElementById('humiDisplay').innerHTML = data.humi.toFixed(1) + ' %';
            } else if (topic === 'factory/data/finger') {
                document.getElementById('fingerStatus').innerHTML = data.success ? `✅ 验证成功 ID:${data.userId}` : '⏳ 等待指纹';
                document.getElementById('fingerRaw').innerHTML = `原始: ${data.raw}`;
            }
        });
    </script>
</body>
</html>
