<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能安防网络示教平台</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0c1126, #020617);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            color: #eef2ff;
            padding: 1.5rem;
        }
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
        }
        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #4f9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172ab3;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .online-led {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* 卡片网格 */
        .cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            width: 350px;
            transition: 0.3s;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #2dd4bf;
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #2dd4bf;
            padding-left: 12px;
        }
        .big-value {
            font-size: 3.2rem;
            font-weight: 700;
            text-align: center;
            margin: 1rem 0;
        }
        .temp-value { color: #f97316; text-shadow: 0 0 8px #f97316aa; }
        .humi-value { color: #38bdf8; text-shadow: 0 0 8px #38bdf8aa; }
        .finger-status {
            font-size: 1.3rem;
            text-align: center;
            margin: 1rem 0;
            font-weight: 500;
        }
        .success { color: #10b981; }
        .fail { color: #f43f5e; }
        .raw-frame {
            background: #00000080;
            border-radius: 12px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 10px;
        }
        .alarm-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 10px;
            font-weight: bold;
        }
        .alarm-on {
            background: #ff7b2c20;
            color: #ff7b2c;
            animation: blink 1s infinite;
        }
        .alarm-off {
            background: #2dd4bf20;
            color: #2dd4bf;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .simulate-panel {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 1rem;
        }
        button {
            background: #2dd4bf20;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2dd4bf40;
            box-shadow: 0 0 6px #2dd4bf;
        }
        input {
            background: #0f172a;
            border: 1px solid #4f9eff;
            border-radius: 30px;
            padding: 5px 10px;
            color: white;
            width: 80px;
            text-align: center;
        }
        iframe {
            border-radius: 16px;
            background: #000;
        }
        .debug-panel {
            background: #0f172a80;
            border-radius: 24px;
            padding: 1rem;
            font-size: 0.75rem;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        @media (max-width: 750px) {
            .card { width: 90%; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="top-bar">
        <div class="logo">🏭 智能安防网络示教平台</div>
        <div class="status-badge">
            <span class="online-led"></span>
            <span id="mqttStatus">连接中...</span>
        </div>
    </div>

    <div class="cards-area">
        <!-- 环境监测卡片 -->
        <div class="card">
            <h2><i class="fas fa-thermometer-half"></i> 环境监测</h2>
            <div class="big-value temp-value" id="tempDisplay">-- °C</div>
            <div class="big-value humi-value" id="humiDisplay">-- %</div>
            <div style="text-align:center;"><span id="alarmDisplay" class="alarm-badge alarm-off">湿度正常</span></div>
            <div style="margin-top: 15px;">
                湿度阈值: <input type="number" id="thresholdInput" step="1" value="70">
                <button id="setThresholdBtn">设置</button>
            </div>
        </div>

        <!-- 历史曲线卡片 -->
        <div class="card" style="width: 450px;">
            <h2><i class="fas fa-chart-line"></i> 温湿度历史曲线</h2>
            <div id="historyChart" style="height: 250px; width: 100%;"></div>
        </div>

        <!-- 指纹门禁卡片 -->
        <div class="card">
            <h2><i class="fas fa-fingerprint"></i> 指纹门禁</h2>
            <div class="finger-status" id="fingerStatus">等待指纹...</div>
            <div id="fingerIdInfo" style="text-align:center;"></div>
            <div class="raw-frame" id="rawDataFrame">原始数据: 无</div>
        </div>

        <!-- 摄像头监控卡片 -->
        <div class="card">
            <h2><i class="fas fa-video"></i> 工厂实时监控</h2>
            <iframe id="cameraStream" src="http://你的ESP32CAM_IP:81/stream" 
                    style="width:100%; height:240px; border:none;" 
                    allowfullscreen>
            </iframe>
            <p style="font-size:0.7rem; text-align:center; margin-top:5px;">请确保摄像头与设备在同一WiFi</p>
        </div>

        <!-- 模拟数据控制卡片 -->
        <div class="card">
            <h2><i class="fas fa-sliders-h"></i> 教学模拟</h2>
            <div class="simulate-panel">
                <span>温度：</span><input type="number" id="simTemp" step="0.1" value="25.0">
                <span>湿度：</span><input type="number" id="simHumi" step="0.1" value="60.0">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="simulateOnBtn">▶ 开启模拟</button>
                <button id="simulateOffBtn">⏹ 关闭模拟</button>
            </div>
            <p style="font-size:0.7rem; margin-top:10px;">模拟开启后，页面显示手动输入值，真实数据暂停更新</p>
        </div>
    </div>

    <!-- 调试日志 -->
    <div class="debug-panel" id="debugPanel">
        <i class="fas fa-terminal"></i> 系统日志<br>
    </div>
</div>

<script>
    // 加载 Font Awesome 图标库
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
    document.head.appendChild(link);

    // MQTT 配置
    const broker = 'wss://broker.emqx.io:8084/mqtt';
    const options = {
        connectTimeout: 4000,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        keepalive: 60
    };
    const client = mqtt.connect(broker, options);
    const debugDiv = document.getElementById('debugPanel');
    function addLog(msg) {
        const p = document.createElement('div');
        p.innerText = msg;
        debugDiv.appendChild(p);
        console.log(msg);
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    // 历史曲线
    let historyChart = null;
    let tempHistory = [], humiHistory = [], timeLabels = [];

    function initHistoryChart() {
        const dom = document.getElementById('historyChart');
        if (!dom) return;
        historyChart = echarts.init(dom);
        historyChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['温度(°C)', '湿度(%)'], textStyle: { color: '#eee' } },
            xAxis: { type: 'category', data: [], axisLabel: { color: '#ccc' } },
            yAxis: [
                { type: 'value', name: '温度', nameTextStyle: { color: '#ccc' } },
                { type: 'value', name: '湿度', nameTextStyle: { color: '#ccc' } }
            ],
            series: [
                { name: '温度', type: 'line', smooth: true, data: [], lineStyle: { color: '#f97316' }, symbol: 'circle' },
                { name: '湿度', type: 'line', smooth: true, data: [], lineStyle: { color: '#38bdf8' }, symbol: 'circle' }
            ]
        });
    }

    function updateChart(temp, humi) {
        if (!historyChart) return;
        const now = new Date().toLocaleTimeString();
        timeLabels.push(now);
        if (timeLabels.length > 50) timeLabels.shift();
        tempHistory.push(temp);
        if (tempHistory.length > 50) tempHistory.shift();
        humiHistory.push(humi);
        if (humiHistory.length > 50) humiHistory.shift();
        historyChart.setOption({
            xAxis: { data: timeLabels.slice() },
            series: [
                { data: tempHistory.slice(), name: '温度' },
                { data: humiHistory.slice(), name: '湿度' }
            ]
        });
    }

    async function loadHistory() {
        try {
            const res = await fetch('/history');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data && data.length) {
                tempHistory = data.map(p => p.temp);
                humiHistory = data.map(p => p.humi);
                timeLabels = data.map((_, i) => i+1);
                historyChart.setOption({
                    xAxis: { data: timeLabels },
                    series: [{ data: tempHistory }, { data: humiHistory }]
                });
                addLog(`📊 已加载历史数据 (${data.length} 条)`);
            }
        } catch(e) { addLog('❌ 加载历史数据失败: ' + e.message); }
    }

    // 更新UI温湿度
    function updateTempHumiUI(temp, humi, alarm) {
        document.getElementById('tempDisplay').innerHTML = temp.toFixed(1) + ' °C';
        document.getElementById('humiDisplay').innerHTML = humi.toFixed(1) + ' %';
        const alarmSpan = document.getElementById('alarmDisplay');
        if (alarm) {
            alarmSpan.innerHTML = '🔔 湿度超限报警！';
            alarmSpan.className = 'alarm-badge alarm-on';
        } else {
            alarmSpan.innerHTML = '✅ 湿度正常';
            alarmSpan.className = 'alarm-badge alarm-off';
        }
        updateChart(temp, humi);
    }

    // MQTT 消息处理
    client.on('connect', () => {
        addLog('✅ MQTT 连接成功 (broker.emqx.io)');
        document.getElementById('mqttStatus').innerHTML = '在线 <i class="fas fa-check-circle"></i>';
        client.subscribe('factory/#', (err) => {
            if (err) addLog('❌ 订阅失败: ' + err);
            else addLog('📡 已订阅 factory/#');
        });
    });

    client.on('message', (topic, message) => {
        const raw = message.toString();
        addLog(`📨 [${topic}] ${raw}`);
        try {
            const data = JSON.parse(raw);
            if (topic === 'factory/temphumi') {
                if (typeof data.temp !== 'undefined') {
                    updateTempHumiUI(data.temp, data.humi, data.alarm === 1);
                }
            } else if (topic === 'factory/finger') {
                const statusDiv = document.getElementById('fingerStatus');
                const idInfo = document.getElementById('fingerIdInfo');
                const rawFrameDiv = document.getElementById('rawDataFrame');
                if (data.success === 1 || data.success === true) {
                    let userName = (data.userId==1?'张三':data.userId==2?'李四':`ID:${data.userId}`);
                    statusDiv.innerHTML = `✅ 验证成功 谢谢您，${userName}！`;
                    statusDiv.className = 'finger-status success';
                    const now = new Date();
                    const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                    idInfo.innerHTML = `用户: ${userName} | 时间: ${timeStr}`;
                } else {
                    statusDiv.innerHTML = '⏳ 等待指纹';
                    statusDiv.className = 'finger-status fail';
                    idInfo.innerHTML = '';
                }
                if (data.raw) rawFrameDiv.innerHTML = `原始数据: ${data.raw}`;
            }
        } catch(e) { addLog(`❌ JSON解析错误: ${e.message}`); }
    });

    client.on('error', (err) => {
        addLog(`❌ MQTT 错误: ${err.message}`);
        document.getElementById('mqttStatus').innerHTML = '离线';
    });

    // 阈值设置（通过HTTP请求，需ESP8266支持）
    document.getElementById('setThresholdBtn').addEventListener('click', () => {
        const val = document.getElementById('thresholdInput').value;
        fetch(`/setThreshold?value=${val}`).then(res => res.text()).then(msg => alert(msg)).catch(e => addLog('设置阈值失败'));
    });

    // 模拟数据控制（通过MQTT发送到ESP8266）
    function sendSimulateCommand(mode, temp, humi) {
        const payload = JSON.stringify({ cmd: "simulate", mode: mode, temp: temp, humi: humi });
        client.publish('factory/control', payload);
        addLog(`📤 发送模拟命令: ${payload}`);
    }
    document.getElementById('simulateOnBtn').addEventListener('click', () => {
        const t = parseFloat(document.getElementById('simTemp').value);
        const h = parseFloat(document.getElementById('simHumi').value);
        sendSimulateCommand(1, t, h);
    });
    document.getElementById('simulateOffBtn').addEventListener('click', () => {
        sendSimulateCommand(0, 0, 0);
    });

    // 页面初始化
    window.onload = () => {
        initHistoryChart();
        loadHistory();
        // 尝试获取摄像头IP（需用户手动修改iframe src，或通过变量配置）
        // 可以在代码中直接替换 "你的ESP32CAM_IP" 为实际IP
    };
</script>
</body>
</html>
