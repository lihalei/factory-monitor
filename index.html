<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能安防网络示教平台 | 工厂环境监控</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0c1126, #020617);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            color: #eef2ff;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #4f9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172ab3;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .online-led {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.8rem;
        }
        .cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        .card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            flex: 1;
            min-width: 280px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.4);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #2dd4bf;
            box-shadow: 0 25px 40px -15px rgba(0,200,255,0.2);
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #2dd4bf;
            padding-left: 12px;
        }
        .big-value {
            font-size: 3.2rem;
            font-weight: 700;
            text-align: center;
            margin: 1rem 0;
        }
        .temp-value { color: #f97316; text-shadow: 0 0 8px #f97316aa; }
        .humi-value { color: #38bdf8; text-shadow: 0 0 8px #38bdf8aa; }
        .finger-status {
            font-size: 1.3rem;
            text-align: center;
            margin: 1rem 0;
            font-weight: 500;
        }
        .success { color: #10b981; }
        .fail { color: #f43f5e; }
        .raw-frame {
            background: #00000080;
            border-radius: 16px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 12px;
        }
        .alarm-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 10px;
            font-weight: bold;
        }
        .alarm-on {
            background: #ff7b2c20;
            color: #ff7b2c;
            animation: blink 1s infinite;
        }
        .alarm-off {
            background: #2dd4bf20;
            color: #2dd4bf;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .sidebar {
            background: rgba(18, 25, 45, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            border: 1px solid rgba(45, 212, 191, 0.3);
            height: fit-content;
            position: sticky;
            top: 1.5rem;
        }
        .sidebar h3 {
            color: #2dd4bf;
            margin: 1rem 0 0.5rem 0;
            font-size: 1.2rem;
        }
        .sidebar ul {
            list-style: none;
            padding-left: 0;
        }
        .sidebar li {
            margin: 12px 0;
        }
        .sidebar a {
            color: #2dd4bf;
            text-decoration: none;
            transition: 0.2s;
        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        .debug-panel {
            margin-top: 2rem;
            background: #0f172a80;
            border-radius: 24px;
            padding: 1rem;
            font-size: 0.75rem;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                margin-top: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <span>智能安防网络示教平台</span>
        </div>
        <div class="status-badge">
            <span class="online-led"></span>
            <span id="mqttStatus">连接中...</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="cards-area">
            <div class="card">
                <h2><i class="fas fa-thermometer-half"></i> 环境监测</h2>
                <div class="big-value temp-value" id="tempDisplay">-- °C</div>
                <div class="big-value humi-value" id="humiDisplay">-- %</div>
                <div style="text-align: center;">
                    <span id="alarmDisplay" class="alarm-badge alarm-off">湿度正常</span>
                </div>
            </div>
            <div class="card">
                <h2><i class="fas fa-fingerprint"></i> 指纹门禁</h2>
                <div class="finger-status" id="fingerStatusText">等待指纹...</div>
                <div id="fingerIdInfo" style="text-align:center; font-size:0.9rem;"></div>
                <div class="raw-frame" id="rawDataFrame">原始数据: 无</div>
            </div>
        </div>

        <div class="sidebar">
            <h3><i class="fas fa-chalkboard-user"></i> 实验指导</h3>
            <p><strong>📘 点击下方主题查看详细实验内容与代码：</strong></p>
            <ul>
                <li><a href="topic1-1.html" target="_blank">🔗 1.1 CC2530终端与协调器的无线传输</a></li>
                <li><a href="topic1-2.html" target="_blank">🔗 1.2 ESP8266与协调器间的数据传输</a></li>
                <li><a href="topic1-3.html" target="_blank">🔗 1.3 ESP8266与传感器间的数据传输</a></li>
                <li><a href="topic1-4.html" target="_blank">🔗 1.4 ESP8266通过TCP协议传给客户端</a></li>
                <li><a href="topic1-5.html" target="_blank">🔗 1.5 局域网映射到公网(MQTT协议)</a></li>
            </ul>
            <p style="margin-top: 20px;"><i class="fas fa-external-link-alt"></i> 点击链接将在新标签页打开详细实验指南。</p>
        </div>
    </div>

    <div class="debug-panel" id="debugPanel">
        <i class="fas fa-terminal"></i> 系统日志<br>
    </div>
</div>

<script>
    const broker = 'wss://broker.emqx.io:8084/mqtt';
    const options = {
        connectTimeout: 4000,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        keepalive: 60
    };
    const client = mqtt.connect(broker, options);
    const debugDiv = document.getElementById('debugPanel');

    function addLog(msg) {
        const p = document.createElement('div');
        p.innerText = msg;
        debugDiv.appendChild(p);
        console.log(msg);
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    client.on('connect', () => {
        addLog('✅ MQTT 连接成功 (broker.emqx.io)');
        document.getElementById('mqttStatus').innerHTML = '在线 <i class="fas fa-check-circle"></i>';
        client.subscribe('factory/#', (err) => {
            if (err) addLog('❌ 订阅失败: ' + err);
            else addLog('📡 已订阅主题 factory/#');
        });
    });

    client.on('message', (topic, message) => {
        const raw = message.toString();
        addLog(`📨 [${topic}] ${raw}`);
        try {
            const data = JSON.parse(raw);
            if (topic === 'factory/temphumi') {
                if (data.temp !== undefined) {
                    document.getElementById('tempDisplay').innerHTML = data.temp.toFixed(1) + ' °C';
                    document.getElementById('humiDisplay').innerHTML = data.humi.toFixed(1) + ' %';
                    const alarmDiv = document.getElementById('alarmDisplay');
                    if (data.alarm === 1 || data.alarm === true) {
                        alarmDiv.innerHTML = '🔔 湿度超限报警！';
                        alarmDiv.className = 'alarm-badge alarm-on';
                    } else {
                        alarmDiv.innerHTML = '✅ 湿度正常';
                        alarmDiv.className = 'alarm-badge alarm-off';
                    }
                }
            } else if (topic === 'factory/finger') {
                const statusDiv = document.getElementById('fingerStatusText');
                const idInfo = document.getElementById('fingerIdInfo');
                const rawFrameDiv = document.getElementById('rawDataFrame');
                if (data.success === 1 || data.success === true) {
                    statusDiv.innerHTML = '✅ 验证成功';
                    statusDiv.className = 'finger-status success';
                    idInfo.innerHTML = `用户 ID: ${data.userId} | 时间: ${data.time || '刚刚'}`;
                } else {
                    statusDiv.innerHTML = '⏳ 等待指纹';
                    statusDiv.className = 'finger-status fail';
                    idInfo.innerHTML = '';
                }
                if (data.raw) rawFrameDiv.innerHTML = `原始数据: ${data.raw}`;
            }
        } catch (e) {
            addLog(`❌ JSON解析错误: ${e.message}`);
        }
    });

    client.on('error', (err) => {
        addLog(`❌ MQTT 错误: ${err.message}`);
        document.getElementById('mqttStatus').innerHTML = '离线';
    });
</script>
</body>
</html>
