<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能安防示教平台</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { background: #0a0f1e; color: #eee; font-family: Arial; padding: 20px; }
        .card { background: rgba(18,25,45,0.8); border-radius: 20px; padding: 20px; margin: 10px; display: inline-block; width: 300px; vertical-align: top; }
        .temp { color: #f97316; font-size: 48px; }
        .humi { color: #38bdf8; font-size: 48px; }
        .success { color: #10b981; }
        .fail { color: #f43f5e; }
        iframe { width: 100%; height: 300px; border-radius: 16px; border: none; }
        button { background: #2dd4bf20; border: 1px solid #2dd4bf; color: #2dd4bf; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        input { width: 60px; background: #000; color: white; border: 1px solid #ff9f4a; border-radius: 16px; padding: 4px; text-align: center; }
    </style>
</head>
<body>
    <h1>🏭 智能安防网络示教平台</h1>
    <div class="card">
        <h2>环境监测</h2>
        <div class="temp" id="temp">-- °C</div>
        <div class="humi" id="humi">-- %</div>
        <div id="alarm">正常</div>
        <div>阈值: <input id="threshold" type="number" step="1" value="70"> <button onclick="setThreshold()">设置</button></div>
    </div>
    <div class="card">
        <h2>历史曲线</h2>
        <div id="chart" style="height: 250px;"></div>
    </div>
    <div class="card">
        <h2>指纹门禁</h2>
        <div id="fingerStatus">等待指纹</div>
        <div id="fingerId"></div>
        <div id="fingerRaw" style="font-size:12px;"></div>
    </div>
    <div class="card">
        <h2>摄像头监控</h2>
        <iframe src="http://你的ESP32CAM_IP:81/stream"></iframe>
    </div>
    <div class="card">
        <h2>模拟数据</h2>
        <input id="simTemp" placeholder="温度" value="25"> °C
        <input id="simHumi" placeholder="湿度" value="60"> %
        <button onclick="enableSimulate(true)">开启模拟</button>
        <button onclick="enableSimulate(false)">关闭模拟</button>
    </div>

    <script>
        const broker = 'wss://broker.emqx.io:8084/mqtt';
        const client = mqtt.connect(broker);
        let chart = null;

        client.on('connect', () => {
            client.subscribe('factory/#');
            console.log('MQTT connected');
        });
        client.on('message', (topic, msg) => {
            const data = JSON.parse(msg.toString());
            if (topic === 'factory/temphumi') {
                document.getElementById('temp').innerHTML = data.temp.toFixed(1) + ' °C';
                document.getElementById('humi').innerHTML = data.humi.toFixed(1) + ' %';
                document.getElementById('alarm').innerHTML = data.alarm ? '🔔 报警' : '✅ 正常';
                updateChart(data.temp, data.humi);
            } else if (topic === 'factory/finger') {
                if (data.success) {
                    document.getElementById('fingerStatus').innerHTML = '✅ 验证成功 谢谢！';
                    document.getElementById('fingerId').innerHTML = `用户ID: ${data.userId}`;
                } else {
                    document.getElementById('fingerStatus').innerHTML = '⏳ 等待指纹';
                    document.getElementById('fingerId').innerHTML = '';
                }
                document.getElementById('fingerRaw').innerHTML = `原始: ${data.raw}`;
            }
        });

        // 历史曲线初始化
        async function loadHistory() {
            const res = await fetch('/history');
            const hist = await res.json();
            const temps = hist.map(h => h.temp);
            const humis = hist.map(h => h.humi);
            const labels = temps.map((_,i) => i+1);
            chart = echarts.init(document.getElementById('chart'));
            chart.setOption({
                xAxis: { data: labels },
                yAxis: { type: 'value' },
                series: [{ name: '温度', type: 'line', data: temps, color: '#f97316' },
                          { name: '湿度', type: 'line', data: humis, color: '#38bdf8' }]
            });
        }
        function updateChart(temp, humi) {
            // 实时追加（简化示例，实际应维护数组）
        }
        loadHistory();

        // 设置湿度阈值（通过MQTT发送命令）
        function setThreshold() {
            const val = document.getElementById('threshold').value;
            // 发送到ESP8266的setThreshold接口（需额外实现）
            fetch(`/setThreshold?value=${val}`).catch(console.log);
        }

        // 模拟数据控制
        function enableSimulate(on) {
            const temp = document.getElementById('simTemp').value;
            const humi = document.getElementById('simHumi').value;
            const cmd = on ? {cmd:"simulate", mode:1, temp: parseFloat(temp), humi: parseFloat(humi)} 
                           : {cmd:"simulate", mode:0};
            client.publish('factory/control', JSON.stringify(cmd));
        }
    </script>
</body>
</html>
