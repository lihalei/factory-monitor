<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能安防网络示教平台 | 工厂环境监控</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 原有样式保留，只新增 .live-data */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #0c1126, #020617);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            color: #eef2ff;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .dashboard { max-width: 1600px; margin: 0 auto; position: relative; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #4f9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .live-data {
            font-size: 1.2rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172ab3;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .online-led {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ecc71;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.8rem;
        }
        .cards-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        .card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            flex: 1;
            min-width: 280px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.4);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #2dd4bf;
            box-shadow: 0 25px 40px -15px rgba(0,200,255,0.2);
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #2dd4bf;
            padding-left: 12px;
        }
        .big-value {
            font-size: 3.2rem;
            font-weight: 700;
            text-align: center;
            margin: 1rem 0;
        }
        .temp-value { color: #f97316; text-shadow: 0 0 8px #f97316aa; }
        .humi-value { color: #38bdf8; text-shadow: 0 0 8px #38bdf8aa; }
        .finger-status {
            font-size: 1.3rem;
            text-align: center;
            margin: 1rem 0;
            font-weight: 500;
        }
        .success { color: #10b981; }
        .fail { color: #f43f5e; }
        .raw-frame {
            background: #00000080;
            border-radius: 16px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 12px;
        }
        .alarm-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 10px;
            font-weight: bold;
        }
        .alarm-on {
            background: #ff7b2c20;
            color: #ff7b2c;
            animation: blink 1s infinite;
        }
        .alarm-off {
            background: #2dd4bf20;
            color: #2dd4bf;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .sidebar {
            background: rgba(18, 25, 45, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            border: 1px solid rgba(45, 212, 191, 0.3);
            height: fit-content;
            position: sticky;
            top: 1.5rem;
        }
        .sidebar h3 {
            color: #2dd4bf;
            margin-bottom: 1rem;
        }
        .sidebar ul {
            list-style: none;
            padding-left: 0;
        }
        .sidebar li {
            margin: 12px 0;
        }
        .sidebar a {
            color: #2dd4bf;
            text-decoration: none;
        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        .debug-panel {
            margin-top: 2rem;
            background: #0f172a80;
            border-radius: 24px;
            padding: 1rem;
            font-size: 0.75rem;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                margin-top: 1.5rem;
            }
            .live-data {
                font-size: 0.9rem;
                padding: 0.2rem 0.6rem;
            }
            .top-bar {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <span>智能安防网络示教平台</span>
        </div>
        <div class="live-data" id="liveData">
            <span id="liveTemp">--</span> °C &nbsp;|&nbsp;
            <span id="liveHumi">--</span> %
        </div>
        <div class="status-badge">
            <span class="online-led"></span>
            <span id="mqttStatus">连接中...</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="cards-area">
            <!-- 温湿度卡片 -->
            <div class="card">
                <h2><i class="fas fa-thermometer-half"></i> 环境监测</h2>
                <div class="big-value temp-value" id="tempDisplay">-- °C</div>
                <div class="big-value humi-value" id="humiDisplay">-- %</div>
                <div style="text-align: center;">
                    <span id="alarmDisplay" class="alarm-badge alarm-off">湿度正常</span>
                </div>
            </div>
            <!-- 历史曲线卡片 -->
            <div class="card" style="min-width: 400px;">
                <h2><i class="fas fa-chart-line"></i> 温湿度历史曲线（最近50条）</h2>
                <div id="historyChart" style="height: 300px; width: 100%;"></div>
            </div>
            <!-- 指纹门禁卡片 -->
            <div class="card">
                <h2><i class="fas fa-fingerprint"></i> 指纹门禁</h2>
                <div class="finger-status" id="fingerStatusText">等待指纹...</div>
                <div id="fingerIdInfo" style="text-align:center; font-size:0.9rem;"></div>
                <div class="raw-frame" id="rawDataFrame">原始数据: 无</div>
            </div>
        </div>
        <div class="sidebar">
            <h3><i class="fas fa-chalkboard-user"></i> 实验指导</h3>
            <ul>
                <li><a href="topic1-1.html" target="_blank">1.1 CC2530终端与协调器的无线传输</a></li>
                <li><a href="topic1-2.html" target="_blank">1.2 ESP8266与协调器间的数据传输</a></li>
                <li><a href="topic1-3.html" target="_blank">1.3 ESP8266与传感器间的数据传输</a></li>
                <li><a href="topic1-4.html" target="_blank">1.4 ESP8266通过TCP协议传给客户端</a></li>
                <li><a href="topic1-5.html" target="_blank">1.5 局域网映射到公网(MQTT协议)</a></li>
            </ul>
            <p style="margin-top: 20px;"><i class="fas fa-external-link-alt"></i> 点击链接在新标签页打开实验详情。</p>
        </div>
    </div>

    <div class="debug-panel" id="debugPanel">
        <i class="fas fa-terminal"></i> 系统日志<br>
    </div>
</div>

<script>
    // -------------------- MQTT 配置 --------------------
    const broker = 'wss://broker.emqx.io:8084/mqtt';
    const options = {
        connectTimeout: 4000,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        keepalive: 60
    };
    const client = mqtt.connect(broker, options);
    const debugDiv = document.getElementById('debugPanel');

    function addLog(msg) {
        const p = document.createElement('div');
        p.innerText = msg;
        debugDiv.appendChild(p);
        console.log(msg);
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    // -------------------- 图表相关 --------------------
    let historyChart = null;
    let tempData = [];
    let humiData = [];
    let timeLabels = [];
    let pendingChartUpdate = false;
    let lastTemp = null, lastHumi = null;
    let chartUpdateTimeout = null;

    function applyChartUpdate() {
        if (lastTemp !== null && lastHumi !== null && historyChart) {
            tempData.push(lastTemp);
            humiData.push(lastHumi);
            timeLabels.push(timeLabels.length + 1);
            if (tempData.length > 50) {
                tempData.shift();
                humiData.shift();
                timeLabels.shift();
            }
            historyChart.setOption({
                xAxis: { data: timeLabels.slice() },
                series: [
                    { data: tempData.slice() },
                    { data: humiData.slice() }
                ]
            });
            lastTemp = null;
            lastHumi = null;
        }
        pendingChartUpdate = false;
        if (chartUpdateTimeout) clearTimeout(chartUpdateTimeout);
        chartUpdateTimeout = null;
    }

    function scheduleChartUpdate(temp, humi) {
        lastTemp = temp;
        lastHumi = humi;
        if (!pendingChartUpdate) {
            pendingChartUpdate = true;
            chartUpdateTimeout = setTimeout(() => {
                applyChartUpdate();
            }, 100);
        }
    }

    function initHistoryChart() {
        const dom = document.getElementById('historyChart');
        if (!dom) return;
        historyChart = echarts.init(dom);
        historyChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['温度(°C)', '湿度(%)'], textStyle: { color: '#eee' } },
            xAxis: { type: 'category', data: [], axisLabel: { color: '#ccc' } },
            yAxis: [
                { type: 'value', name: '温度', nameTextStyle: { color: '#ccc' }, axisLabel: { color: '#ccc' } },
                { type: 'value', name: '湿度', nameTextStyle: { color: '#ccc' }, axisLabel: { color: '#ccc' } }
            ],
            series: [
                { name: '温度', type: 'line', smooth: true, data: [], lineStyle: { color: '#f97316' }, symbol: 'circle', symbolSize: 6, animation: false },
                { name: '湿度', type: 'line', smooth: true, data: [], lineStyle: { color: '#38bdf8' }, symbol: 'circle', symbolSize: 6, animation: false }
            ]
        });
        historyChart.setOption({ animation: false });
    }

    async function loadHistory() {
        try {
            const res = await fetch('/history');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data && data.length) {
                tempData = data.map(p => p.temp);
                humiData = data.map(p => p.humi);
                timeLabels = data.map((_, i) => i+1);
                historyChart.setOption({
                    xAxis: { data: timeLabels.slice() },
                    series: [
                        { data: tempData.slice() },
                        { data: humiData.slice() }
                    ]
                });
                addLog(`📊 已加载历史数据 (${data.length} 条)`);
            } else {
                addLog('📊 无历史数据');
            }
        } catch(e) {
            addLog('❌ 加载历史数据失败: ' + e.message);
        }
    }

    // -------------------- MQTT 回调 --------------------
    client.on('connect', () => {
        addLog('✅ MQTT 连接成功 (broker.emqx.io)');
        document.getElementById('mqttStatus').innerHTML = '在线 <i class="fas fa-check-circle"></i>';
        client.subscribe('factory/#', (err) => {
            if (err) addLog('❌ 订阅失败: ' + err);
            else addLog('📡 已订阅主题 factory/#');
        });
    });

    client.on('message', (topic, message) => {
        const raw = message.toString();
        addLog(`📨 [${topic}] ${raw}`);
        try {
            const data = JSON.parse(raw);
            if (topic === 'factory/temphumi') {
                if (typeof data.temp !== 'undefined') {
                    // 更新各个显示位置
                    document.getElementById('tempDisplay').innerHTML = data.temp.toFixed(1) + ' °C';
                    document.getElementById('humiDisplay').innerHTML = data.humi.toFixed(1) + ' %';
                    document.getElementById('liveTemp').innerHTML = data.temp.toFixed(1);
                    document.getElementById('liveHumi').innerHTML = data.humi.toFixed(1);
                    const alarmDiv = document.getElementById('alarmDisplay');
                    if (data.alarm) {
                        alarmDiv.innerHTML = '🔔 湿度超限报警！';
                        alarmDiv.className = 'alarm-badge alarm-on';
                    } else {
                        alarmDiv.innerHTML = '✅ 湿度正常';
                        alarmDiv.className = 'alarm-badge alarm-off';
                    }
                    scheduleChartUpdate(data.temp, data.humi);
                }
            } else if (topic === 'factory/finger') {
                const statusDiv = document.getElementById('fingerStatusText');
                const idInfo = document.getElementById('fingerIdInfo');
                const rawFrameDiv = document.getElementById('rawDataFrame');
                if (data.success === 1 || data.success === true) {
                    const userId = data.userId;
                    let userName = (userId==1?'张三':userId==2?'李四':userId==3?'王工':userId==4?'赵厂长':`ID:${userId}`);
                    statusDiv.innerHTML = `✅ 验证成功 谢谢您，${userName}！`;
                    statusDiv.className = 'finger-status success';
                    const now = new Date();
                    const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                    idInfo.innerHTML = `用户: ${userName} | 时间: ${timeStr}`;
                } else {
                    statusDiv.innerHTML = '⏳ 等待指纹';
                    statusDiv.className = 'finger-status fail';
                    idInfo.innerHTML = '';
                }
                if (data.raw) rawFrameDiv.innerHTML = `原始数据: ${data.raw}`;
            }
        } catch (e) {
            addLog(`❌ JSON解析错误: ${e.message}`);
        }
    });

    client.on('error', (err) => {
        addLog(`❌ MQTT 错误: ${err.message}`);
        document.getElementById('mqttStatus').innerHTML = '离线';
    });

    window.onload = () => {
        initHistoryChart();
        loadHistory();
    };
</script>
</body>
</html>
