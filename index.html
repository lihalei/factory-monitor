<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能安防示教平台</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: radial-gradient(circle at 20% 30%, #0c1126, #020617); font-family: 'Segoe UI', sans-serif; color: #eef2ff; padding: 1.5rem; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; background: rgba(15,23,42,0.6); backdrop-filter: blur(12px); padding: 0.8rem 2rem; border-radius: 60px; margin-bottom: 2rem; }
        .logo { font-size: 1.4rem; font-weight: 600; background: linear-gradient(135deg,#fff,#4f9eff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .status-badge { display: flex; align-items: center; gap: 8px; background: #0f172ab3; padding: 6px 16px; border-radius: 40px; }
        .online-led { width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 6px #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .cards-area { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }
        .card { background: rgba(18,25,45,0.65); backdrop-filter: blur(12px); border-radius: 32px; padding: 1.5rem; width: 350px; border: 1px solid rgba(0,255,255,0.2); transition: 0.3s; }
        .card:hover { transform: translateY(-4px); border-color: #2dd4bf; }
        .card h2 { font-size: 1.5rem; margin-bottom: 1rem; border-left: 4px solid #2dd4bf; padding-left: 12px; }
        .big-value { font-size: 3.2rem; font-weight: 700; text-align: center; margin: 1rem 0; }
        .temp-value { color: #f97316; }
        .humi-value { color: #38bdf8; }
        .finger-status { font-size: 1.3rem; text-align: center; margin: 1rem 0; }
        .success { color: #10b981; }
        .fail { color: #f43f5e; }
        .raw-frame { background: #00000080; border-radius: 12px; padding: 8px; font-family: monospace; font-size: 0.7rem; word-break: break-all; margin-top: 10px; }
        .simulate-panel { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
        button { background: #2dd4bf20; border: 1px solid #2dd4bf; color: #2dd4bf; padding: 6px 12px; border-radius: 30px; cursor: pointer; }
        input { background: #0f172a; border: 1px solid #4f9eff; border-radius: 30px; padding: 5px 10px; color: white; width: 80px; text-align: center; }
        .debug-panel { margin-top: 2rem; background: #0f172a80; border-radius: 24px; padding: 1rem; font-size: 0.75rem; font-family: monospace; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="top-bar">
        <div class="logo">🏭 智能安防网络示教平台</div>
        <div class="status-badge"><span class="online-led"></span><span id="mqttStatus">连接中...</span></div>
    </div>
    <div class="cards-area">
        <!-- 环境监测 -->
        <div class="card">
            <h2>环境监测</h2>
            <div class="big-value temp-value" id="tempDisplay">-- °C</div>
            <div class="big-value humi-value" id="humiDisplay">-- %</div>
            <div>湿度阈值: <input id="thresholdInput" type="number" step="1" value="70"> <button id="setThresholdBtn">设置</button></div>
        </div>
        <!-- 历史曲线 -->
        <div class="card" style="width: 450px;">
            <h2>温湿度历史曲线</h2>
            <div id="historyChart" style="height: 250px;"></div>
        </div>
        <!-- 指纹门禁 -->
        <div class="card">
            <h2>指纹门禁</h2>
            <div class="finger-status" id="fingerStatus">等待指纹...</div>
            <div id="fingerIdInfo"></div>
            <div class="raw-frame" id="rawDataFrame">原始数据: 无</div>
        </div>
        <!-- 教学模拟 -->
        <div class="card">
            <h2>教学模拟</h2>
            <div class="simulate-panel">
                <span>温度：</span><input id="simTemp" value="25.0" step="0.1">
                <span>湿度：</span><input id="simHumi" value="60.0" step="0.1">
                <button id="simulateOnBtn">▶ 开启模拟</button>
                <button id="simulateOffBtn">⏹ 关闭模拟</button>
            </div>
        </div>
    </div>
    <div class="debug-panel" id="debugPanel">📡 系统日志<br></div>
</div>
<script>
    const broker = 'wss://broker.emqx.io:8084/mqtt';
    const client = mqtt.connect(broker, { clientId: 'web_' + Math.random().toString(16).substr(2,8) });
    const debugDiv = document.getElementById('debugPanel');
    function addLog(msg) { const p = document.createElement('div'); p.innerText = msg; debugDiv.appendChild(p); console.log(msg); debugDiv.scrollTop = debugDiv.scrollHeight; }

    let historyChart = null;
    let tempHistory = [], humiHistory = [], timeLabels = [];

    function initChart() {
        const dom = document.getElementById('historyChart');
        if (!dom) return;
        historyChart = echarts.init(dom);
        historyChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['温度(°C)', '湿度(%)'], textStyle: { color: '#eee' } },
            xAxis: { type: 'category', data: [], axisLabel: { color: '#ccc' } },
            yAxis: [{ type: 'value', name: '温度' }, { type: 'value', name: '湿度' }],
            series: [{ name: '温度', type: 'line', data: [], smooth: true, lineStyle: { color: '#f97316' } },
                      { name: '湿度', type: 'line', data: [], smooth: true, lineStyle: { color: '#38bdf8' } }]
        });
    }

    function updateChart(temp, humi) {
        const now = new Date().toLocaleTimeString();
        timeLabels.push(now); if (timeLabels.length > 50) timeLabels.shift();
        tempHistory.push(temp); if (tempHistory.length > 50) tempHistory.shift();
        humiHistory.push(humi); if (humiHistory.length > 50) humiHistory.shift();
        historyChart.setOption({ xAxis: { data: timeLabels.slice() }, series: [{ data: tempHistory.slice() }, { data: humiHistory.slice() }] });
    }

    async function loadHistory() {
        try {
            const res = await fetch('/history');
            const data = await res.json();
            if (data.length) {
                tempHistory = data.map(p => p.temp);
                humiHistory = data.map(p => p.humi);
                timeLabels = data.map((_,i) => i+1);
                historyChart.setOption({ xAxis: { data: timeLabels }, series: [{ data: tempHistory }, { data: humiHistory }] });
                addLog(`已加载 ${data.length} 条历史数据`);
            }
        } catch(e) { addLog('加载历史失败: ' + e.message); }
    }

    client.on('connect', () => {
        addLog('MQTT 连接成功');
        document.getElementById('mqttStatus').innerHTML = '在线';
        client.subscribe('factory/#');
    });
    client.on('message', (topic, msg) => {
        const data = JSON.parse(msg.toString());
        if (topic === 'factory/temphumi') {
            document.getElementById('tempDisplay').innerHTML = data.temp.toFixed(1) + ' °C';
            document.getElementById('humiDisplay').innerHTML = data.humi.toFixed(1) + ' %';
            updateChart(data.temp, data.humi);
        } else if (topic === 'factory/finger') {
            const statusDiv = document.getElementById('fingerStatus');
            const idInfo = document.getElementById('fingerIdInfo');
            const rawDiv = document.getElementById('rawDataFrame');
            if (data.success) {
                statusDiv.innerHTML = `✅ 验证成功 用户ID:${data.userId}`;
                statusDiv.className = 'finger-status success';
                idInfo.innerHTML = `时间: ${new Date().toLocaleString()}`;
            } else {
                statusDiv.innerHTML = '⏳ 等待指纹';
                statusDiv.className = 'finger-status fail';
                idInfo.innerHTML = '';
            }
            if (data.raw) rawDiv.innerHTML = `原始: ${data.raw}`;
        }
    });
    client.on('error', (err) => { addLog('MQTT错误: ' + err.message); document.getElementById('mqttStatus').innerHTML = '离线'; });

    document.getElementById('setThresholdBtn').onclick = () => {
        const val = document.getElementById('thresholdInput').value;
        fetch(`/setThreshold?value=${val}`).then(res => res.text()).then(alert).catch(e => addLog('设置阈值失败'));
    };
    function sendSimulate(mode, temp, humi) {
        const payload = JSON.stringify({ mode: mode, temp: temp, humi: humi });
        client.publish('factory/control', payload);
        addLog(`发送模拟命令: ${payload}`);
    }
    document.getElementById('simulateOnBtn').onclick = () => {
        const t = parseFloat(document.getElementById('simTemp').value);
        const h = parseFloat(document.getElementById('simHumi').value);
        sendSimulate(1, t, h);
    };
    document.getElementById('simulateOffBtn').onclick = () => sendSimulate(0, 0, 0);

    window.onload = () => { initChart(); loadHistory(); };
</script>
</body>
</html>
