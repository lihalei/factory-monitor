<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能安防示教平台 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eef2ff;
        }
        .login-card {
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem;
            width: 360px;
            border: 1px solid rgba(45, 212, 191, 0.4);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #4f9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub {
            color: #8ba0c0;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e6;
        }
        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid #2dd4bf60;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 8px #2dd4bf;
        }
        button {
            width: 100%;
            background: #2dd4bf20;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
            padding: 12px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2dd4bf40;
            box-shadow: 0 0 12px #2dd4bf;
        }
        .error-msg {
            color: #f43f5e;
            margin-top: 1rem;
            font-size: 0.85rem;
            height: 40px;
        }
        .tips {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #7e8aa8;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h1>智能安防网络示教平台</h1>
    <div class="sub">教师端 / 学生端</div>
    <div class="input-group">
        <label>账号</label>
        <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button id="loginBtn">登录</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="tips">教师账号: 20220901 / 214214 &nbsp;|&nbsp; 学生账号: 20220901 / 220444</div>
</div>
<script>
    // 账号相同，通过密码区分角色
    const validUsers = {
        '20220901': {
            '214214': { role: '教师', name: '教师' },
            '220444': { role: '学生', name: '学生' }
        }
    };
    document.getElementById('loginBtn').addEventListener('click', () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        if (!username || !password) {
            errorDiv.innerText = '请填写账号和密码';
            return;
        }
        const user = validUsers[username];
        if (!user || !user[password]) {
            errorDiv.innerText = '账号或密码错误';
            return;
        }
        const role = user[password].role;
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userRole', role);
        localStorage.setItem('username', username);
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
